# EXAMPLE — delete this file once you've added a real property.

# --- Market (must match a key under `markets:` in config.yml) ---
market: atlanta

# --- Location ---
address: 123 Example St
city: Decatur
state: GA
zip: "30032"
neighborhood: Example Subdivision          # optional

# --- Numbers ---
price: 145000          # your asking price to the buyer
arv: 265000
repairs: 45000
# spread: 75000        # optional — auto-calculated as ARV − price − repairs if left out
rent: 1850             # optional, monthly

# --- Property details ---
beds: 3
baths: 2
sqft: 1450
year_built: 1978
lot_size: 0.25 acres
occupancy: Vacant                  # Vacant / Tenant occupied / Owner occupied
exit_strategy: Flip or BRRRR       # Flip / BRRRR / Rental
condition: Medium rehab            # Light / Medium / Heavy rehab

# --- Why this deal works (as many bullets as you want) ---
highlights:
  - Flip comps at $260K–$275K within 0.5 miles in the last 6 months
  - Roof replaced 2019, HVAC 2021
  - Mostly cosmetic — paint, flooring, kitchen and baths
  - Strong rental demand, 5 minutes to I-285

# --- Terms ---
emd: 5000
close_by: October 15, 2026
title_company: Example Title Co.
showing: Lockbox — call or text for access
financing: Cash or hard money only

# --- Links & photos ---
# Photos: full URL (GHL Media Library: Upload -> click photo -> Copy link)
#         OR just a filename you uploaded into the /photos folder.
main_photo: https://placehold.co/1072x640/224066/FFFFFF?text=Front+Photo
# Extra photos show in a 2-column grid under the highlights
photos:
  - https://placehold.co/526x360/BDC3CA/224066?text=Kitchen
  - https://placehold.co/526x360/BDC3CA/224066?text=Living+Room
photos_and_comps_link: https://example.com/your-google-drive-folder   # optional

# --- Optional overrides ---
# badge: PRICE DROP                 # default: NEW OFF-MARKET DEAL
# intro: "Custom opening line..."   # default: "we just locked up this one in <city>..."
# subject_lines:                    # default: 4 auto-generated options
#   - My custom subject
